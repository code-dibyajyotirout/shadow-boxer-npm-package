name: Bug Report
description: Create a report to help us improve shadow-boxer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with shadow-boxer.
  - type: input
    id: version
    attributes:
      label: shadow-boxer Version
      description: What version of shadow-boxer are you using?
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Import ShadowBoxer component
        2. Set filterCutoff to ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS, React version, etc.
